name: Build data and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 北京时间开奖日17:10 / 18:20：仅开奖前且数据新鲜时生成快照
    - cron: '10 9 * * 0,2,4'
    - cron: '20 10 * * 0,2,4'
    # 北京时间开奖日22:57 / 23:37：等待上游发布结果
    - cron: '57 14 * * 0,2,4'
    - cron: '37 15 * * 0,2,4'
    # 次日上午10:17兜底同步
    - cron: '17 2 * * 1,3,5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Python data pipeline
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify JavaScript generation logic
        run: node --test tests/*.test.mjs
      - name: Refresh history (retain validated fallback on network failure)
        run: python scripts/update_data.py
      - name: Settle old forecasts / create eligible pre-draw snapshot
        run: node scripts/forecast.mjs
      - name: Commit public journal on scheduled runs
        if: github.event_name == 'schedule'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/predictions.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: append pre-draw forecast / settlement [skip ci]'
            git push origin HEAD:main
          fi
      - name: Inspect deployed data
        run: python -c "import json; d=json.load(open('web/data/history.json')); print('Validated historical draws:', len(d)); assert len(d)>=100"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
